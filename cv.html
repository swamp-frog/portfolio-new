<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>david's cv</title>
<style>
    @keyframes blur{
        0%{filter: opacity(0%);}
        100%{filter: opacity(100%);}
    }
    html {
    height: 100vh;
    width: 100vw;
    background-color: whitesmoke;
    overflow: hidden;
    overscroll-behavior: none; 
    touch-action: none; 
    }

    * {
  box-sizing: border-box;
}

    body, button, input, select, textarea {
  font-family: monospace;
  font-size: 10pt;
}
   
    body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: monospace;
    overflow: hidden;
    overscroll-behavior: none; 
    touch-action: none; 
    /* height: auto; */
    /* padding-bottom: 20vh; */
    }

    .photo{
    display: block;
    height: 90vh;
    width: auto;
    object-fit: contain;
    /* left:50%; */
    animation: blur 0.3s ease-in-out;
    }
    .downloadcv{
        position: fixed;
        bottom: 4.5vh;
    color: rgb(81, 144, 165);
    cursor: pointer;
    transition: background-color 0.4s ease, color 0.2s ease-in-out;
    font-family: monospace;
    text-decoration: none;
    }
    .downloadcv:hover{
    /* color: rgb(198, 239, 255); */
    /* background-color: rgb(61, 61, 61); */
    background-color: rgb(158, 207, 223);
    color: rgb(63, 113, 130);;
    /* color: black; */
    }
    .footer{
    /* display: inline-block; */
    position: fixed;
    display: block;
    width: 97.4%;
    bottom: 2%;
    left: 1.3%;
    cursor: pointer;
    /* font-size: 9pt; */
    }

    @media (max-width: 800px) {
    .photo{
    position: absolute;
    display: block;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90vw;
    height: auto;
    max-height: 100dvh;
    object-fit: contain;
    animation: blur 0.3s ease-in-out;
    }
    }

</style>
 </head>
<body>
    <img src="cv.webp" class="photo">
    <div class="footer">
    <p class="plink"><a class="downloadcv" href="cv.pdf" download="cv.pdf">download pdf</a></p>
    </div>
</body>
</html>
